name: Canote Windows Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canote-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BRAND_FONTS_REQUIRED: "0"
      OPENWHISPR_CHANNEL: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Validate release version
        shell: pwsh
        env:
          TRIGGER_TAG: ${{ github.ref_name }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable semantic version in package.json.' }
          $releaseTag = "v$version"
          if ($env:TRIGGER_EVENT -eq 'push' -and $env:TRIGGER_TAG -ne $releaseTag) {
            throw 'The tag must match package.json.'
          }
          $tagCommit = git rev-list -n 1 $releaseTag 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne $env:GITHUB_SHA) { throw 'The release tag belongs to another commit.' }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm run test:canote
      - name: Build unsigned Windows installer and update metadata
        run: npm run build:win -- --config electron-builder.unsigned-win.json --x64 --publish never
      - name: Verify update artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/latest.yml)) { throw 'Missing latest.yml: the app could not discover this update.' }
          if (-not (Get-ChildItem dist -Filter '*.exe')) { throw 'Missing Windows installer.' }
          if (-not (Get-ChildItem dist -Filter '*.blockmap')) { throw 'Missing installer blockmap.' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Canote-${{ env.RELEASE_TAG }}-windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Upload a draft release
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw 'Refusing to replace assets on an already published release.' }
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --draft --title "Canote $env:RELEASE_TAG" --target $env:GITHUB_SHA --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
